plugins {
    id 'java-library'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'com.diffplug.spotless' version '8.0.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoFormRuntime {
    verbose = true

}

// Keep the upstream teaching examples byte-for-byte; format only TIMELOCKED additions.
spotless {
    java {
        target 'src/main/java/com/timelocked/**/*.java', 'validation/*.java'
        googleJavaFormat('1.28.0')
        removeUnusedImports()
    }
}

// Static Java checks, separate from Spotless formatting. Both mod namespaces are checked.
checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
}
tasks.withType(Checkstyle).configureEach {
    reports { xml.required = true; html.required = true }
}
// This explicit debt inventory is NOT a passing quality gate. Geometry and gameplay
// literals are both included so reviewers can see the unfiltered remaining work.
tasks.register('auditMagicNumbers', Checkstyle) {
    description = 'Report all Java numeric literals requiring human classification (non-gating).'
    group = 'verification'
    source = fileTree('src/main/java') { include '**/*.java' }
    classpath = files()
    configFile = file('config/checkstyle/magic-numbers.xml')
    ignoreFailures = true
    reports {
        xml.outputLocation = layout.buildDirectory.file('reports/checkstyle/magic-numbers.xml')
        html.outputLocation = layout.buildDirectory.file('reports/checkstyle/magic-numbers.html')
    }
}
// Prevent numeric-rule regressions in the controller cleaned up by this patch.
tasks.register('checkArrivalNumbers', Checkstyle) {
    description = 'Enforce named numeric rules in the cleaned gameplay and geometry classes.'
    group = 'verification'
    source = files(
        'src/main/java/com/timelocked/HubArrival.java',
        'src/main/java/com/timelocked/HubLighting.java',
        'src/main/java/com/timelocked/WakePresentation.java',
        'src/main/java/com/timelocked/client/IntroClient.java',
        'src/main/java/com/timelocked/PushBarDoorBlock.java',
        'src/main/java/com/timelocked/TransitionDoorways.java',
        'src/main/java/com/timelocked/CoastChapter.java',
        'src/main/java/com/timelocked/ReceptionChapter.java',
        'src/main/java/com/timelocked/StaffChapter.java',
        'src/main/java/com/timelocked/FacilitySpawnProtection.java',
        'src/main/java/com/timelocked/GlassStairwell.java',
        'src/main/java/com/timelocked/AuthoredGeometry.java',
        'src/main/java/com/timelocked/SarcHangingLogoBlock.java',
        'src/main/java/com/timelocked/client/VehicleModels.java',
        'src/main/java/com/timelocked/FacilityState.java',
        'src/main/java/com/timelocked/SiteProgress.java',
        'src/main/java/com/timelocked/AlarmRules.java',
        'src/main/java/com/timelocked/BatonItem.java',
        'src/main/java/com/timelocked/DockingRules.java',
        'src/main/java/com/timelocked/VehicleDeploymentItem.java',
        'src/main/java/com/timelocked/IntroDeparture.java',
        'src/main/java/com/timelocked/CelestialWorkstationBlock.java',
        'src/main/java/com/timelocked/GunItem.java',
        'src/main/java/com/timelocked/client/mixin/StartupOverlayMixin.java'
    )
    classpath = files()
    configFile = file('config/checkstyle/magic-numbers.xml')
}
tasks.named('check') { dependsOn 'checkArrivalNumbers' }
