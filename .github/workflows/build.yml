name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Non-gating debt report, explicitly separate from the enforced build checks.
      - name: Inventory remaining numeric literals
        run: ./gradlew auditMagicNumbers

      - name: Upload Java lint and numeric debt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-lint-reports
          path: build/reports/checkstyle/
          if-no-files-found: warn

      - name: Set up optional helper checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python, JSON, TOML and YAML
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/check_project.py

      - name: Set up documentation checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check documentation formatting and shell syntax
        run: |
          npm ci --ignore-scripts
          npm run lint:docs
          bash -n tools/process_anthem.sh
